services:
  pro-mtls-manager:
    image: ghcr.io/cjng20u/xlab-mtls:latest
    container_name: pro-mtls-manager
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Optional settings: copy .env.example to .env and edit (see README)
    env_file:
      - path: .env
        required: false
    environment:
      # These are fixed inside the container; change the host port in "ports" instead
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_DIR=/app/pki_storage
      - TZ=America/New_York
    volumes:
      # Your private CA, issued certs, CRL and settings. BACK THIS UP.
      - ./pki_storage:/app/pki_storage
      # Optional: SSH key for syncing to Caddy. The app falls back to this path
      # when no key is pasted in the Caddy settings. Uncomment only if the file
      # exists on the host (otherwise Docker creates an empty folder there).
      # - /root/.ssh/id_rsa:/root/.ssh/id_rsa:ro
